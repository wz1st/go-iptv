# iptv 容器 —— nginx 主配置（对外唯一入口）

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/vnd.ms-fontobject font/ttf font/otf
                      image/svg+xml;

    # APK 底包、图标、EPG 列表都可能不小；apktool 编译大包时请求体也会偏大。
    client_max_body_size 512m;

    # 透传给后端的 Host —— 必须**带端口
    map $http_host $iptv_upstream_host {
        default $http_host;
        ""      $host;
    }

    # 前端产物根目录 —— Dockerfile 把 iptv-web 的 dist 拷到这里。
    root /app/web;

    # 后端（iptv-api）。只在容器内可达，不对外暴露，因此绑 127.0.0.1。
    upstream iptv_api {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    # 中转服务（授权引擎里的代理进程，只有开启「中转访问」后才在监听）。
    upstream iptv_proxy {
        server 127.0.0.1:8080;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        # 重定向一律发**相对** Location（而不是 nginx 默认的绝对地址）
        absolute_redirect off;

        # 0. 移动端 UA：把「/」送到前端的 /mobile 路由
        location = / {
            if ($http_user_agent ~* "(android|iphone|ipod|ipad|mobile|windows phone|harmonyos)") {
                return 302 /mobile;
            }
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
        }

        # 1. 后端接口（规范前缀）
        location ^~ /api/ {
            proxy_pass http://iptv_api;
            include /etc/nginx/conf.d/proxy_params.inc;
        }

        # 2. 客户端 / 播放器旧接口（兼容前缀，不可删）
        location ~ ^/(apk|mytv|getRss|ku9|epg|r|k)/ {
            proxy_pass http://iptv_api;
            include /etc/nginx/conf.d/proxy_params.inc;
        }

        # 3. 中转（/p/**）
        location ^~ /p/ {
            proxy_pass http://iptv_proxy;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_connect_timeout    10s;
            proxy_read_timeout       3600s;
            proxy_send_timeout       3600s;

            gzip        off;
            access_log  off;
            add_header  Cache-Control "no-cache" always;
        }

        # 4. 后台（/admin/**）—— 现在是纯前端页面，这里**不再**单独处理

        # 5. 同一 URL 上「页面 + 接口」共存的特例
        location = /version {
            proxy_pass http://iptv_api;
            include /etc/nginx/conf.d/proxy_params.inc;
        }

        location = /ChangeLog.md {
            proxy_pass http://iptv_api;
            include /etc/nginx/conf.d/proxy_params.inc;
        }

        # 6. 静态资源目录：nginx 直接从磁盘取，不再绕后端
        location ^~ /app/ {
            alias /config/app/;
            access_log off;
            expires 1h;
        }
        location ^~ /images/ {
            alias /config/images/bj/;
            access_log off;
            expires 7d;
        }
        location ^~ /icon/ {
            alias /config/images/icon/;
            access_log off;
            expires 7d;
        }
        location ^~ /logo/ {
            alias /config/logo/;
            access_log off;
            expires 7d;
        }
        # 下载页/登录页的品牌图与 README 里的收款码：源码在
        location ^~ /static/ {
            alias /app/web/static/;
            access_log off;
            expires 7d;
        }

        # 7. 前端产物
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 兜底：先找真实文件 → 再找目录 → 都没有才交给 SPA 回落。
        location / {
            try_files $uri $uri/ @spa;
            add_header Cache-Control "no-cache" always;
        }

        # 8. 命名回落：后端 404 时把 index.html 交出去
        location @spa {
            if ($http_accept !~* "text/html") {
                return 404;
            }
            root /app/web;
            try_files /index.html =404;
            add_header Cache-Control "no-cache" always;
        }
    }
}
