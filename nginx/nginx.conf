# iptv 容器 —— nginx 主配置（对外唯一入口）

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/vnd.ms-fontobject font/ttf/otf
                      image/svg+xml;

    # APK 底包、图标、EPG 列表都可能不小；apktool 编译大包时请求体也会偏大。
    client_max_body_size 512m;

    # 透传给后端的 Host —— 必须**带端口
    map $http_host $iptv_upstream_host {
        default $http_host;
        ""      $host;
    }

    # 前端产物根目录 —— Dockerfile 把 iptv-web 的 dist 拷到这里。
    root /app/web;

    # 后端（iptv-api）。只在容器内可达，不对外暴露，因此绑 127.0.0.1。
    upstream iptv_api {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    # 中转服务（授权引擎里的代理进程，只有开启「中转访问」后才在监听）。
    upstream iptv_proxy {
        server 127.0.0.1:8080;
    }

    # ---------------------------------------------------------------- HTTP
    server {
        listen       80;
        listen       [::]:80;

        # 「80 强制跳转 HTTPS」开关，由后台「SSL 证书」页维护：
        #   - 关：/config/nginx/redirect80.inc 是空文件（或不存在）⇒ 什么都不做；
        #   - 开：文件里就是一行 `return 301 https://$host$request_uri;`。
        # 用**通配**包含：文件不存在时 nginx 不报错（空匹配是允许的），
        # 因此这个开关不依赖"文件先被创建出来"的启动顺序。
        # 放在 location 之前：server 级的 return 在 rewrite 阶段生效，优先于所有 location。
        include /config/nginx/redirect80*.inc;

        # 站点本体（与 :443 共用同一份规则，见 nginx/site.inc）
        include /etc/nginx/conf.d/site.inc;
    }

    # ---------------------------------------------------------------- HTTPS
    # 可选的 HTTPS 站点。文件由后台「SSL 证书」页生成（证书/私钥存 /config/cert），
    # **放持久卷**而不是容器层，所以容器重建后不用重配。
    # 同样是通配包含：没开 HTTPS 时这里一个文件都匹配不到，nginx 照常启动。
    include /config/nginx/https*.conf;
}
