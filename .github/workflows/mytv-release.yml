name: 发布 mytv 编译基底

# 触发：推送 mytv-vX.Y.Z 标签。与 api（vX.Y.Z）、引擎（engine-vX.Y.Z）同仓不同前缀，三段号各自独立演进。
on:
  push:
    tags:
      - 'mytv-v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '基底版本号（mytv-vX.Y.Z）'
        required: true

permissions:
  contents: write

# 同一序列排队而非并行：并行发两版会互相覆盖同名资产，最后留下哪一份说不清。
concurrency:
  group: mytv-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      # 标签、Version_mytv、APK 三者必须自洽：在线升级端会把 Version_mytv 与标签逐字比对，对不上直接拒绝安装。
      - name: 校验基底版本号
        id: check
        run: |
          set -e
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          V="${TAG#mytv-v}"
          printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::标签必须是 mytv-vX.Y.Z（收到 $TAG）"; exit 1; }
          FILE_V="$(tr -d ' \r\n' < mytv/Version_mytv)"
          if [ "$FILE_V" != "$V" ]; then
            echo "::error::mytv/Version_mytv 写的是 $FILE_V，标签是 $V，两者必须一致"
            exit 1
          fi
          [ -s mytv/MyTV.apk ] || { echo "::error::mytv/MyTV.apk 不存在或为空"; exit 1; }
          [ "$(head -c2 mytv/MyTV.apk)" = "PK" ] || { echo "::error::mytv/MyTV.apk 缺 PK 魔数，不是合法 APK"; exit 1; }
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$V" >> $GITHUB_OUTPUT

      # 资产名是外部契约：api 侧 until/mytvOnline.go 按 MyTV.apk / Version_mytv 逐字找，改名不会有报错，只会在用户点「在线升级」时变成"下载不到"。
      - name: 发布基底到 go-iptv releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: mytv 基底 ${{ steps.check.outputs.version }}
          prerelease: false
          overwrite_files: true
          files: |
            mytv/MyTV.apk
            mytv/Version_mytv
