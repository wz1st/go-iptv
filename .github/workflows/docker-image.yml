name: 构建镜像并发布
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（vX.Y.Z）'
        required: true

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.google.cn
  # 只发 amd64：Google 的 Linux build-tools 只有 x86_64，arm64 镜像里的 aapt2/zipalign
  # 根本跑不起来（QEMU 下报 Invalid ELF image）；而且发布资产也只有 amd64 一套。
  TARGET_PLATFORMS: linux/amd64
  WEB_REPO: wz1st/iptv-web
  START_REPO: wz1st/iptv-start

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      
      - name: 解析版本号
        id: parse
        run: |
          set -e
          V="${{ github.event.inputs.version || github.ref_name }}"
          case "$V" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::版本号必须是三段式 vX.Y.Z（收到 $V）"; exit 1 ;;
          esac
          echo "version=$V" >> $GITHUB_OUTPUT
          if [ "$V" != "${V%-*}" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  
  web:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPO }}
          path: web-src
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      
      - name: 构建前端
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          cd web-src
          npm ci
          npm run build
          test -f dist/index.html || { echo "::error::前端产物缺少 index.html"; exit 1; }
          grep -q "name=\"app-version\" content=\"$APP_VERSION\"" dist/index.html \
            || { echo "::error::前端产物里没有预期的版本标记（APP_VERSION=$APP_VERSION）"; exit 1; }
          rm -rf ../webdist
          mv dist ../webdist
          ls -la ../webdist
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: webdist
          if-no-files-found: error
          retention-days: 3

  
  start:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.START_REPO }}
          path: start-src
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: start-src/go.sum
      - name: 构建启动器（amd64）
        run: |
          set -e
          cd start-src
          gofmt -l . | tee /tmp/fmt-start
          [ ! -s /tmp/fmt-start ] || { echo "::error::启动器 gofmt 未通过"; exit 1; }
          go vet ./...
          go test ./... -count=1
          mkdir -p ../start_all
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags '-s -w' -o ../start_all/start_amd64 .
          ls -l ../start_all
      - uses: actions/upload-artifact@v4
        with:
          name: start_all
          path: start_all
          if-no-files-found: error
          retention-days: 3

  
  app:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: iptv-api/go.sum
      - name: 构建 iptv-api（amd64）
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          cd iptv-api
          gofmt -l . | tee /tmp/fmt-api
          [ ! -s /tmp/fmt-api ] || { echo "::error::iptv-api gofmt 未通过"; exit 1; }
          go vet ./...
          go test ./... -count=1
          mkdir -p ../iptv_all
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "-s -w -X iptv-api/until.Version=$VERSION" \
            -o ../iptv_all/iptv_amd64 main.go
          
          ../iptv_all/iptv_amd64 -version | grep -qx "$VERSION" \
            || { echo "::error::iptv 二进制报告的版本不是 $VERSION"; ../iptv_all/iptv_amd64 -version; exit 1; }
          ls -l ../iptv_all
      - uses: actions/upload-artifact@v4
        with:
          name: iptv_all
          path: iptv_all
          if-no-files-found: error
          retention-days: 3

  
  
  
  
  engine:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 找最新稳定引擎 release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            | jq -rs 'add // []
                  | [.[] | select((.prerelease|not)
                                  and (.tag_name|test("^engine-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                                  and ([.assets[]?.name]|index("SHA256SUMSEngine.txt") != null)
                                  and ([.assets[]?.name]|index("SHA256SUMS.txt") == null))]
                  | sort_by(.tag_name | ltrimstr("engine-v") | split(".") | map(tonumber))
                  | (last // {}) | .tag_name // ""' \
            | tr -d '"\r')
          [ -n "$TAG" ] || { echo "::error::本仓还没有合格的稳定引擎 release（engine-vX.Y.Z，且带 SHA256SUMSEngine.txt、不含 api 产物）。请先在 iptv-engine 推一个 vX.Y.Z 标签，让引擎仓的 CI 发布"; exit 1; }
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "使用引擎 release：$TAG"

      
      
      - name: 下载并校验引擎产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -e
          mkdir -p engine_all
          
          
          gh release download "$TAG" --repo "$REPO" --dir engine_all --clobber \
            --pattern 'engine_amd64' \
            --pattern 'SHA256SUMSEngine.txt'

          # release 资产是裸 blob、不保存 mode ⇒ 下载回来一律 0644，要执行就得自己 chmod
          ls -l engine_all
          # 先断言齐全再 chmod：反过来时缺产物会由 chmod 抢着报 "cannot access"，把问题说成工具报错
          f="engine_all/engine_amd64"
          test -f "$f" || { echo "::error::$TAG 里缺少 engine_amd64，镜像需要 amd64 产物"; exit 1; }
          chmod +x "$f"
          test -x "$f" || { echo "::error::engine_amd64 没有可执行位（release 资产不带 mode，必须显式 chmod）"; exit 1; }
          ( cd engine_all && sha256sum -c SHA256SUMSEngine.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: engine_all
          path: engine_all
          if-no-files-found: error
          retention-days: 3

  
  image:
    needs: [prepare, web, start, app, engine]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: webdist
      - uses: actions/download-artifact@v4
        with:
          name: iptv_all
          path: iptv_all
      - uses: actions/download-artifact@v4
        with:
          name: engine_all
          path: engine_all
      - uses: actions/download-artifact@v4
        with:
          name: start_all
          path: start_all

      
      - name: 生成前端整包与校验清单
        run: |
          set -e
          # artifact 传递同样丢 mode（app job 里 0755 ⇒ 本 job 下载后 0644），三份产物都要补
          ls -l iptv_all engine_all start_all
          for f in iptv_all/iptv_amd64 start_all/start_amd64 engine_all/engine_amd64; do
            test -f "$f" || { echo "::error::缺少产物 $f（artifact 没传全？）"; exit 1; }
            chmod +x "$f"
          done
          # 别写成 ENG=$(... -version | tr)：管道退出码取自 tr，前半段失败会被 set -e 漏掉
          ENG=$(./engine_all/engine_amd64 -version)
          ENG=$(printf '%s' "$ENG" | tr -d '\r')
          echo "引擎版本：$ENG"
          case "$ENG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::引擎 -version 输出不是三段版本号：$ENG"; exit 1 ;;
          esac

          tar -czf iptv_all/webdist.tar.gz webdist
          tar -tzf iptv_all/webdist.tar.gz | head -5

          ( cd iptv_all && sha256sum iptv_amd64 webdist.tar.gz > SHA256SUMS.txt )
          cat iptv_all/SHA256SUMS.txt

      - name: 发布 api 到 go-iptv releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite_files: true
          files: iptv_all/*

      - name: 探测跨仓发布令牌
        run: |
          if [ -n "${{ secrets.OTHER_REPO_TOKEN }}" ]; then
            echo "OTHER_REPO_TOKEN_PRESENT=true" >> $GITHUB_ENV
          else
            echo "未配置 OTHER_REPO_TOKEN，跳过前端/启动器发布"
          fi

      - name: 发布前端到 iptv-web releases
        if: ${{ env.OTHER_REPO_TOKEN_PRESENT == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.OTHER_REPO_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release view "$VERSION" --repo "$WEB_REPO" >/dev/null 2>&1 \
            || gh release create "$VERSION" --repo "$WEB_REPO" \
                 --title "$VERSION" --notes "前端产物 $VERSION"
          gh release upload "$VERSION" iptv_all/webdist.tar.gz --repo "$WEB_REPO" --clobber

      - name: 发布启动器到 iptv-start releases
        if: ${{ env.OTHER_REPO_TOKEN_PRESENT == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.OTHER_REPO_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release view "$VERSION" --repo "$START_REPO" >/dev/null 2>&1 \
            || gh release create "$VERSION" --repo "$START_REPO" \
                 --title "$VERSION" --notes "启动器产物 $VERSION"
          gh release upload "$VERSION" \
            start_all/start_amd64 \
            --repo "$START_REPO" --clobber

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          platforms: ${{ env.TARGET_PLATFORMS }}
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/iptv:${{ needs.prepare.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/iptv:latest
          cache-from: type=gha,scope=iptv-image
          cache-to: type=gha,scope=iptv-image,mode=max
